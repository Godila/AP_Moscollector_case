---
id: helpdeskCreate
name: helpdeskCreate
description: >-
  Оформляет заявку в HelpDeskEddy. Работает в два захода. Первый вызов ничего
  не создаёт: функция проверяет, все ли сведения собраны, и возвращает
  черновик заявки вместе с confirmToken. Покажи черновик сотруднику и спроси,
  создавать ли заявку. Получив согласие, вызови функцию ещё раз с теми же
  данными и с confirmToken из черновика — только тогда заявка будет создана.
  Перед созданием функция сама ищет уже открытые заявки с тем же кодом ошибки
  и, если такая есть, новую не заводит.
response-description: >-
  reason "need_details" — сведений не хватает. В missing перечислены поля
  с готовыми вопросами: задай их сотруднику одним сообщением, дождись ответов
  и вызови функцию заново. Придумывать ответы за сотрудника нельзя.
  stage "draft" — заявка ещё НЕ создана. Покажи сотруднику содержимое draft
  разборчивым списком: тема, система, код ошибки, приоритет, срок реакции,
  от чьего имени оформляется, — и спроси, создавать ли заявку. Получив
  согласие, вызови функцию повторно с теми же данными и confirmToken из ответа.
  Если сотрудник просит что-то поправить, внеси правку и вызови функцию снова
  без confirmToken — придёт новый черновик.
  stage "created" и duplicate=false — заявка создана: назови её номер из поля
  number, срок реакции из reaction и постановщика из requester.
  duplicate=true — заявка не создавалась, нашлась открытая с тем же кодом
  ошибки: назови её номер и статус и спроси, приложить ли обращение к ней.
  При ok=false поле reason объясняет причину: not_configured — интеграция
  не настроена, unauthorized — не приняты учётные данные, rate_limited —
  превышен лимит запросов, request_failed — сервис ответил ошибкой. Повторять
  вызов при этих ошибках нельзя: скажи, что заявку создать не удалось,
  и предложи обратиться в поддержку напрямую.
parameters:
  - name: title
    type: STRING
    required: true
    description: >-
      Короткая тема заявки одной строкой, по сути проблемы. Например
      "Не открывается АРМ ДС, ошибка E-402".
  - name: system
    type: STRING
    required: true
    description: >-
      Система, в которой возникла проблема. Например "АРМ ДС", "HelpDesk",
      "DocsVision", "Почта".
  - name: whatHappened
    type: STRING
    required: true
    description: >-
      Что сотрудник делал, что ожидал получить и что получил вместо этого.
      Связным текстом, словами сотрудника. Не пересказывай сюда тему заявки:
      если сотрудник этого не рассказал, спроси.
  - name: errorCode
    type: STRING
    required: true
    description: >-
      Код ошибки, который показала система. Например "E-402". По нему ищутся
      дубли, поэтому спрашивай его всегда. Если кода нет, передай "нет" —
      это допустимый ответ, но придумывать код нельзя.
  - name: startedAt
    type: STRING
    required: true
    description: >-
      Когда проблема началась, словами сотрудника. Например "сегодня около
      девяти утра", "со вчерашнего вечера".
  - name: repeats
    type: STRING
    required: true
    description: >-
      Повторяется ли проблема или случилась однократно. Например
      "повторяется при каждом входе", "было один раз".
  - name: categoryId
    type: STRING
    required: false
    description: >-
      Категория обращения из справочника правил: critical-failure,
      system-malfunction, access, hardware, consultation, change-request.
      Выбери подходящую по сути обращения.
  - name: requesterEmail
    type: STRING
    required: false
    description: >-
      Рабочая почта сотрудника. Заполняй только если функция спросила её
      в missing и сотрудник назвал почту в ответ. В остальных случаях оставляй
      пустым: функция опознаёт сотрудника сама. Придумывать или подбирать
      почту нельзя — заявка уйдёт от чужого имени.
  - name: confirmToken
    type: STRING
    required: false
    description: >-
      Метка черновика из поля confirmToken. Передавай её только после того,
      как показал сотруднику состав заявки и получил от него явное согласие
      создать её. При первом вызове оставляй пустым. Если данные заявки после
      подтверждения изменились, метка перестанет подходить и функция вернёт
      новый черновик — это защита от создания заявки, которую сотрудник
      не видел.
  - name: dbIntegration
    type: INTEGRATION_DB
    required: true
    description: >-
      Интеграция базы проекта. Выбирается в настройках узла, модель её
      не заполняет.
language: JAVASCRIPT
