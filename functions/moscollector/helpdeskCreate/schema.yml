---
id: helpdeskCreate
name: helpdeskCreate
description: "Оформляет заявку в HelpDeskEddy. Работает в два захода. Первый вызов\
  \ ничего не создаёт: функция проверяет, все ли сведения собраны, и возвращает че\
  рновик заявки вместе с confirmToken. Покажи черновик сотруднику и спроси, создав\
  ать ли заявку. Получив согласие, вызови функцию ещё раз с теми же данными и с confirmToken\
  \ из черновика — только тогда заявка будет создана. Перед созданием функция сама\
  \ ищет уже открытые заявки с тем же кодом ошибки и, если такая есть, новую не за\
  водит."
response-description: "reason \"need_details\" — сведений не хватает. В missing пе\
  речислены поля с готовыми вопросами: задай их сотруднику одним сообщением, дожди\
  сь ответов и вызови функцию заново. Придумывать ответы за сотрудника нельзя. stage\
  \ \"draft\" — заявка ещё НЕ создана. Покажи сотруднику содержимое draft разборчи\
  вым списком: тема, система, код ошибки, приоритет, срок реакции, от чьего имени\
  \ оформляется, — и спроси, создавать ли заявку. Получив согласие, вызови функцию\
  \ повторно с теми же данными и confirmToken из ответа. Если сотрудник просит что\
  -то поправить, внеси правку и вызови функцию снова без confirmToken — придёт нов\
  ый черновик. stage \"created\" и duplicate=false — заявка создана: назови её ном\
  ер из поля number, срок реакции из reaction и постановщика из requester. duplicate=true\
  \ — заявка не создавалась, нашлась открытая с тем же кодом ошибки: назови её ном\
  ер и статус и спроси, приложить ли обращение к ней. При ok=false поле reason объ\
  ясняет причину: not_configured — интеграция не настроена, unauthorized — не прин\
  яты учётные данные, rate_limited — превышен лимит запросов, request_failed — сер\
  вис ответил ошибкой. Повторять вызов при этих ошибках нельзя: скажи, что заявку\
  \ создать не удалось, и предложи обратиться в поддержку напрямую."
parameters:
- name: title
  type: STRING
  required: true
  description: "Короткая тема заявки одной строкой, по сути проблемы. Например \"Н\
    е открывается АРМ ДС, ошибка E-402\"."
  properties: null
  items: null
- name: system
  type: STRING
  required: true
  description: "Система, в которой возникла проблема. Например \"АРМ ДС\", \"HelpDesk\"\
    , \"DocsVision\", \"Почта\"."
  properties: null
  items: null
- name: whatHappened
  type: STRING
  required: true
  description: "Что сотрудник делал, что ожидал получить и что получил вместо этог\
    о. Связным текстом, словами сотрудника. Не пересказывай сюда тему заявки: если\
    \ сотрудник этого не рассказал, спроси."
  properties: null
  items: null
- name: errorCode
  type: STRING
  required: true
  description: "Код ошибки, который показала система. Например \"E-402\". По нему\
    \ ищутся дубли, поэтому спрашивай его всегда. Если кода нет, передай \"нет\" —\
    \ это допустимый ответ, но придумывать код нельзя."
  properties: null
  items: null
- name: startedAt
  type: STRING
  required: true
  description: "Когда проблема началась, словами сотрудника. Например \"сегодня ок\
    оло девяти утра\", \"со вчерашнего вечера\"."
  properties: null
  items: null
- name: repeats
  type: STRING
  required: true
  description: "Повторяется ли проблема или случилась однократно. Например \"повто\
    ряется при каждом входе\", \"было один раз\"."
  properties: null
  items: null
- name: categoryId
  type: STRING
  required: false
  description: "Категория обращения из справочника правил: critical-failure, system-malfunction,\
    \ access, hardware, consultation, change-request. Выбери подходящую по сути об\
    ращения."
  properties: null
  items: null
- name: requesterEmail
  type: STRING
  required: false
  description: "Рабочая почта сотрудника. Заполняй только если функция спросила её\
    \ в missing и сотрудник назвал почту в ответ. В остальных случаях оставляй пус\
    тым: функция опознаёт сотрудника сама. Придумывать или подбирать почту нельзя\
    \ — заявка уйдёт от чужого имени."
  properties: null
  items: null
- name: confirmToken
  type: STRING
  required: false
  description: "Метка черновика из поля confirmToken. Передавай её только после то\
    го, как показал сотруднику состав заявки и получил от него явное согласие созд\
    ать её. При первом вызове оставляй пустым. Если данные заявки после подтвержде\
    ния изменились, метка перестанет подходить и функция вернёт новый черновик — э\
    то защита от создания заявки, которую сотрудник не видел."
  properties: null
  items: null
- name: dbIntegration
  type: INTEGRATION_DB
  required: true
  description: "Интеграция базы проекта. Выбирается в настройках узла, модель её н\
    е заполняет."
  properties: null
  items: null
language: JAVASCRIPT
