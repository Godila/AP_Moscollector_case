---
id: helpdeskCreate
name: helpdeskCreate
description: "Создаёт заявку в HelpDeskEddy. Перед созданием сама ищет уже открыты\
  е заявки с тем же признаком: если такая есть, новую не создаёт, а возвращает най\
  денную. Вызывай только когда собраны все сведения о проблеме: в какой системе, ч\
  то делали, что получилось вместо ожидаемого, код ошибки. Недостающее спрашивай у\
  \ сотрудника до вызова, не придумывай за него."
response-description: "При ok=true и duplicate=false заявка создана: назови сотруд\
  нику её номер из поля number и срок реакции из поля reaction. При ok=true и duplicate=true\
  \ заявка не создавалась, потому что нашлась открытая с тем же признаком: назови\
  \ её номер, скажи, в каком она статусе, и спроси, приложить ли обращение к ней.\
  \ При ok=true поле requester содержит ФИО постановщика — упомяни его, чтобы сотр\
  удник видел, от чьего имени оформлена заявка. reason \"need_requester_email\" —\
  \ это не ошибка: сотрудник ещё не привязан к каналу. Задай ему вопрос из поля question,\
  \ дождись ответа и вызови функцию повторно, передав почту в requesterEmail. Даль\
  ше он будет опознаваться сам. При остальных ok=false поле reason объясняет причи\
  ну: not_configured — интеграция не настроена, unauthorized — не приняты учётные\
  \ данные, rate_limited — превышен лимит запросов, request_failed — сервис ответи\
  л ошибкой. Повторять вызов при этих ошибках нельзя: скажи сотруднику, что заявку\
  \ создать не удалось, и предложи обратиться в поддержку напрямую."
parameters:
- name: title
  type: STRING
  required: true
  description: "Короткая тема заявки одной строкой, по сути проблемы. Например \"Н\
    е открывается АРМ ДС, ошибка E-402\"."
  properties: null
  items: null
- name: description
  type: STRING
  required: true
  description: "Описание проблемы: что делал сотрудник, что ожидал получить, что п\
    олучил фактически, когда началось, повторяется ли. Пиши связным текстом."
  properties: null
  items: null
- name: system
  type: STRING
  required: true
  description: "Система, в которой возникла проблема. Например \"АРМ ДС\", \"HelpDesk\"\
    , \"DocsVision\", \"Почта\"."
  properties: null
  items: null
- name: errorCode
  type: STRING
  required: false
  description: "Код ошибки, если сотрудник его назвал. Например \"E-402\". По нему\
    \ ищутся дубли, поэтому передавай его всегда, когда он известен."
  properties: null
  items: null
- name: categoryId
  type: STRING
  required: false
  description: "Категория обращения из справочника правил: critical-failure, system-malfunction,\
    \ access, hardware, consultation, change-request. Выбери подходящую по сути об\
    ращения."
  properties: null
  items: null
- name: requesterEmail
  type: STRING
  required: false
  description: "Рабочая почта сотрудника. Заполняй только если функция вернула reason\
    \ \"need_requester_email\" и сотрудник назвал почту в ответ. В остальных случа\
    ях оставляй пустым: функция опознаёт сотрудника сама. Придумывать или подбират\
    ь почту нельзя."
  properties: null
  items: null
- name: dbIntegration
  type: INTEGRATION_DB
  required: true
  description: "Интеграция базы проекта. Выбирается в настройках узла, модель её н\
    е заполняет."
  properties: null
  items: null
language: JAVASCRIPT
