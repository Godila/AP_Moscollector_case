---
id: draftMemo
name: draftMemo
description: "Готовит служебную записку по корпоративному шаблону: подбирает подхо\
  дящий шаблон, проверяет состав полей по инструкции по делопроизводству и собирае\
  т текст. Вызывай, когда сотрудник просит оформить служебную или докладную записк\
  у. Если функция вернула need_fields, задай сотруднику перечисленные вопросы, дож\
  дись ответов и вызови её повторно, добавив полученные значения в fieldsJson. При\
  думывать значения за сотрудника нельзя."
response-description: "При ok=true поля title, body, approvalRoute и regulationRef\
  \ содержат готовую записку и маршрут согласования — покажи текст сотруднику и на\
  зови маршрут. При ok=false с reason \"need_fields\" в missing перечислены недост\
  ающие поля с готовыми вопросами: задай их. При reason \"template_not_found\" в available\
  \ перечислены доступные виды записок: предложи выбрать. При reason \"absent\", \"\
  broken\" или \"bad_fields\" — поломка настройки, скажи, что шаблоны недоступны."
parameters:
- name: topic
  type: STRING
  required: true
  description: "О чём записка, словами сотрудника. Например \"внеплановый выезд бр\
    игады\", \"работа в выходной\", \"выделение СИЗ\", \"перенос ППР\", \"происшес\
    твие\"."
  properties: null
  items: null
- name: fieldsJson
  type: STRING
  required: false
  description: "JSON-объект со значениями полей, которые сотрудник уже назвал. Клю\
    чи — имена полей из missing, значения — строки. Например {\"location\":\"Калан\
    чёвская ул., участок К-14\",\"datetime\":\"21.08.2026 в 09:00\"}. При первом в\
    ызове передавай пустой объект {}."
  properties: null
  items: null
- name: dbIntegration
  type: INTEGRATION_DB
  required: true
  description: "Интеграция базы проекта. Выбирается в настройках узла, модель её н\
    е заполняет."
  properties: null
  items: null
language: JAVASCRIPT
