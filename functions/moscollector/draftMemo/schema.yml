---
id: draftMemo
name: draftMemo
description: >-
  Готовит служебную записку по корпоративному шаблону: подбирает подходящий
  шаблон, проверяет состав полей по инструкции по делопроизводству и собирает
  текст. Вызывай, когда сотрудник просит оформить служебную или докладную
  записку. Если функция вернула need_fields, задай сотруднику перечисленные
  вопросы, дождись ответов и вызови её повторно, добавив полученные значения
  в fieldsJson. Придумывать значения за сотрудника нельзя.
response-description: >-
  При ok=true поля title, body, approvalRoute и regulationRef содержат готовую
  записку и маршрут согласования — покажи текст сотруднику и назови маршрут.
  При ok=false с reason "need_fields" в missing перечислены недостающие поля
  с готовыми вопросами: задай их. При reason "template_not_found" в available
  перечислены доступные виды записок: предложи выбрать. При reason "absent",
  "broken" или "bad_fields" — поломка настройки, скажи, что шаблоны недоступны.
parameters:
  - name: topic
    type: STRING
    required: true
    description: >-
      О чём записка, словами сотрудника. Например "внеплановый выезд бригады",
      "работа в выходной", "выделение СИЗ", "перенос ППР", "происшествие".
  - name: fieldsJson
    type: STRING
    required: false
    description: >-
      JSON-объект со значениями полей, которые сотрудник уже назвал. Ключи —
      имена полей из missing, значения — строки. Например
      {"location":"Каланчёвская ул., участок К-14","datetime":"21.08.2026 в 09:00"}.
      При первом вызове передавай пустой объект {}.
  - name: dbIntegration
    type: INTEGRATION_DB
    required: true
    description: >-
      Интеграция базы проекта. Выбирается в настройках узла, модель её
      не заполняет.
language: JAVASCRIPT
