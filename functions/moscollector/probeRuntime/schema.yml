id: probeRuntime
name: probeRuntime
description: >-
  Диагностика песочницы: сообщает, какие глобальные объекты доступны коду
  функции и каков полный идентификатор бота. Вызывай только если пользователь
  написал слово ДИАГНОСТИКА. Во всех остальных случаях этот инструмент
  использовать нельзя.
response-description: >-
  Объект с результатами проверки. Передай его пользователю как есть, в виде
  списка "имя: значение", ничего не интерпретируя и не додумывая.
parameters: []
