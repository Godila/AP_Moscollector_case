---
id: navGuide
name: navGuide
description: >-
  Возвращает пошаговый сценарий входа в корпоративный сервис или перехода в его
  раздел: АРМ ДС, HelpDesk, DocsVision, смена пароля. Вызывай, когда пользователь
  спрашивает, как куда-то зайти, где что находится или как выполнить действие в
  интерфейсе системы. Шаги берутся из справочника сценариев: если подходящего
  сценария нет, функция об этом сообщит, и придумывать шаги самостоятельно нельзя.
response-description: >-
  При found=true поля service, section, steps и url содержат готовый сценарий:
  steps - упорядоченный список шагов, url - прямая ссылка на раздел, note -
  предупреждение, которое стоит передать пользователю. При found=false поле
  reason объясняет причину: not_found - подходящего сценария нет, в suggestions
  перечислено, что есть в справочнике; absent или broken - справочник не
  настроен, надо сказать пользователю, что сценарии недоступны.
parameters:
  - name: request
    type: STRING
    required: true
    description: >-
      Что пользователь хочет сделать, своими словами. Например "как посмотреть
      список бригад в АРМ Диспетчера", "вход в HelpDesk", "сменить пароль".
  - name: dbIntegration
    type: INTEGRATION_DB
    required: true
    description: >-
      Интеграция базы проекта. Выбирается в настройках узла, модель её
      не заполняет.
language: JAVASCRIPT
