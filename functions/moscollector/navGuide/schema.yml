---
id: navGuide
name: navGuide
description: "Возвращает пошаговый сценарий входа в корпоративный сервис или перех\
  ода в его раздел: АРМ ДС, HelpDesk, DocsVision, смена пароля. Вызывай, когда пол\
  ьзователь спрашивает, как куда-то зайти, где что находится или как выполнить дей\
  ствие в интерфейсе системы. Шаги берутся из справочника сценариев: если подходящ\
  его сценария нет, функция об этом сообщит, и придумывать шаги самостоятельно нел\
  ьзя."
response-description: "При found=true поля service, section, steps и url содержат\
  \ готовый сценарий: steps - упорядоченный список шагов, url - прямая ссылка на р\
  аздел, note - предупреждение, которое стоит передать пользователю. При found=false\
  \ поле reason объясняет причину: not_found - готового сценария в справочнике нет\
  , и это НЕ повод отвечать \"не знаю\": вызови searchRegulations, руководства по\
  \ системам лежат в базе знаний, и ответ, скорее всего, там. Состав справочника с\
  ценариев пользователю не перечисляй, ему это ничего не даёт. absent или broken -\
  \ справочник не настроен, надо сказать пользователю, что сценарии недоступны."
parameters:
- name: request
  type: STRING
  required: true
  description: "Что пользователь хочет сделать, своими словами. Например \"как пос\
    мотреть список бригад в АРМ Диспетчера\", \"вход в HelpDesk\", \"сменить парол\
    ь\"."
  properties: null
  items: null
- name: dbIntegration
  type: INTEGRATION_DB
  required: true
  description: "Интеграция базы проекта. Выбирается в настройках узла, модель её н\
    е заполняет."
  properties: null
  items: null
language: JAVASCRIPT
