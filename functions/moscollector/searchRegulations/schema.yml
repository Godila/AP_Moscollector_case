---
id: searchRegulations
name: searchRegulations
description: "Ищет ответ в корпоративной базе знаний: регламенты, инструкции, руко\
  водства по системам. Вызывай для вопросов о порядке работ, требованиях, сроках,\
  \ периодичности, действиях в нештатных ситуациях. Достаточно одного вызова: функ\
  ция сама отбирает подходящие фрагменты и отсекает нерелевантные. Если вернулось\
  \ found=false, повторять поиск другими словами бесполезно — этого в базе знаний\
  \ нет."
response-description: "При found=true поле items содержит фрагменты документов: content\
  \ — текст, document — название документа-источника, url — ссылка на него. Отвеча\
  й только по этим фрагментам и обязательно назови документ. При found=false ответ\
  а в базе знаний нет: так и скажи пользователю, не пересказывай ничего и не подби\
  рай другую формулировку запроса."
parameters:
- name: query
  type: STRING
  required: true
  description: "Поисковый запрос по сути вопроса пользователя, своими словами, без\
    \ служебных слов. Например \"порядок допуска в коллектор наряд-допуск\"."
  properties: null
  items: null
- name: ragIntegration
  type: INTEGRATION_RAG
  required: true
  description: "Интеграция базы знаний. Выбирается в настройках узла, модель её не\
    \ заполняет."
  properties: null
  items: null
- name: minScore
  type: NUMBER
  required: true
  description: "Порог релевантности. Задаётся константой в настройках узла, модель\
    \ его не заполняет."
  properties: null
  items: null
language: JAVASCRIPT
