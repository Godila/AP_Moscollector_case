name: helpdeskStatus
description: "Показывает состояние заявок в HelpDeskEddy. Если сотрудник назвал но\
  мер заявки — возвращает её состояние, если нет — последние заявки. Вызывай, когд\
  а спрашивают «что с моей заявкой», «в каком статусе заявка», «какие у меня заявк\
  и»."
response-description: "При ok=true поле tickets содержит найденные заявки: number\
