---
id: helpdeskStatus
name: helpdeskStatus
description: >-
  Показывает состояние заявок в HelpDeskEddy. Если сотрудник назвал номер
  заявки — возвращает её состояние, если нет — последние заявки. Вызывай,
  когда спрашивают «что с моей заявкой», «в каком статусе заявка», «какие
  у меня заявки».
response-description: >-
  При ok=true поле tickets содержит найденные заявки: number — номер, title —
  тема, status — состояние по-русски, createdAt и updatedAt — даты. Перечисли
  их сотруднику коротко. Если tickets пуст, заявок не нашлось — так и скажи.
  При ok=false поле reason объясняет причину: not_configured — интеграция
  не настроена, unauthorized — не приняты учётные данные, rate_limited —
  превышен лимит запросов, request_failed — сервис ответил ошибкой.
  Повторять вызов при ошибке нельзя.
parameters:
  - name: number
    type: STRING
    required: false
    description: >-
      Номер заявки, если сотрудник его назвал. Например "FCJ-16227".
      Если номер не назван, оставь пустым — вернутся последние заявки.
  - name: dbIntegration
    type: INTEGRATION_DB
    required: true
    description: >-
      Интеграция базы проекта. Выбирается в настройках узла, модель её
      не заполняет.
language: JAVASCRIPT
