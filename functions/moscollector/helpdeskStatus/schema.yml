  аты. Перечисли их сотруднику коротко. Если tickets пуст, заявок не нашлось — так\
  \ и скажи. При ok=false поле reason объясняет причину: not_configured — интеграц\
  ия не настроена, unauthorized — не приняты учётные данные, rate_limited — превыш\
  ен лимит запросов, request_failed — сервис ответил ошибкой. Повторять вызов при\
  \ ошибке нельзя."
