---
id: publishDocument
name: publishDocument
description: >-
  Сохраняет готовый документ во встроенное файловое хранилище и возвращает
  ссылку, по которой его можно скачать. Сама отправляет файл в чат. Вызывай,
  когда пользователь просит прислать документ файлом, а не текстом в переписке:
  служебную записку, инструкцию, перечень, график. Формат задаётся расширением
  в имени файла: Word, Excel или простой текст. Содержимое должно быть уже
  полностью составлено — функция ничего не дописывает и не проверяет.
response-description: >-
  При ok=true поле url содержит ссылку на файл, name — имя файла. Файл уже
  отправлен в чат, поэтому просто подтверди это и приведи ссылку. При ok=false
  поле reason объясняет причину: runtime_missing — хранилище недоступно
  из песочницы, docx_missing — библиотека Word недоступна, попробуй то же
  содержимое с расширением txt, upload_failed — хранилище отклонило загрузку,
  no_link — хранилище приняло файл, но ссылку не вернуло. При ok=false скажи
  пользователю, что файл сформировать не удалось, и выдай документ текстом
  в переписке.
parameters:
  - name: fileName
    type: STRING
    required: true
    description: >-
      Имя файла с расширением, латиницей. Расширение выбирай по содержимому:
      "docx" — документ Word для служебных записок, инструкций, писем;
      "xls" — таблица Excel для перечней, графиков, сводок и реестров;
      "txt" — простая заметка без оформления. Например "sluzhebnaya-zapiska.docx"
      или "grafik-ppr.xls".
  - name: content
    type: STRING
    required: true
    description: >-
      Содержимое документа целиком, готовое к выдаче.
      Для "docx" — текст в разметке markdown, оформление накладывается само:
      "# " — заголовок документа по центру, "## " — подзаголовок раздела,
      "> " — блок в правой части листа для адресата и реквизитов, "- " и "1. "
      — списки, "**жирный**" и "*курсив*" внутри строки, строка "---" —
      отчёркивание, строки из ячеек, разделённых знаком "|", — таблица
      (со строкой-разделителем "| --- |" таблица получит рамки и шапку,
      без неё — станет невидимой раскладкой для подписи или реквизитов).
      Абзацы разделяй пустой строкой; внутри абзаца строки не рви — соседние
      строки склеиваются в один абзац.
      Для "xls" — только таблица: первая строка с заголовками столбцов, ячейки
      разделены знаком "|". Для "txt" — простой текст.
language: JAVASCRIPT
