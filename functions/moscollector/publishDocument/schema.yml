---
id: publishDocument
name: publishDocument
description: "Сохраняет готовый текст документа во встроенное файловое хранилище и\
  \ возвращает ссылку, по которой файл можно скачать. Вызывай, когда пользователь\
  \ просит прислать документ файлом, а не текстом в переписке: служебную записку,\
  \ инструкцию, выписку. Текст документа должен быть уже полностью составлен — фун\
  кция ничего не дописывает и не проверяет."
response-description: "При ok=true поле url содержит ссылку на файл, name — имя фа\
  йла. Отдай ссылку пользователю. При ok=false поле reason объясняет причину: runtime_missing\
  \ — хранилище недоступно из песочницы, upload_failed — хранилище отклонило загру\
  зку, no_link — хранилище приняло файл, но ссылку не вернуло. В любом случае при\
  \ ok=false скажи пользователю, что файл сформировать не удалось, и предложи полу\
  чить документ текстом в переписке."
parameters:
- name: fileName
  type: STRING
  required: true
  description: "Имя файла с расширением, латиницей или кириллицей. Расширение опре\
    деляет, чем файл откроется: \"txt\" — простой текст, \"html\" — форматированны\
    й документ. Например \"sluzhebnaya-zapiska.txt\"."
  properties: null
  items: null
- name: content
  type: STRING
  required: true
  description: "Полный текст документа целиком, готовый к выдаче пользователю. Для\
    \ расширения \"html\" — валидная HTML-разметка."
  properties: null
  items: null
language: JAVASCRIPT
