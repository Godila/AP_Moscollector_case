---
id: publishDocument
name: publishDocument
description: "Сохраняет готовый документ во встроенное файловое хранилище и возвра\
  щает ссылку, по которой его можно скачать. Сама отправляет файл в чат. Вызывай,\
  \ когда пользователь просит прислать документ файлом, а не текстом в переписке:\
  \ служебную записку, инструкцию, перечень, график. Формат задаётся расширением в\
  \ имени файла: Word, Excel или простой текст. Содержимое должно быть уже полност\
  ью составлено — функция ничего не дописывает и не проверяет."
response-description: "При ok=true поле url содержит ссылку на файл, name — имя фа\
  йла. Файл уже отправлен в чат, поэтому просто подтверди это и приведи ссылку. Пр\
  и ok=false поле reason объясняет причину: runtime_missing — хранилище недоступно\
  \ из песочницы, docx_missing — библиотека Word недоступна, попробуй то же содерж\
  имое с расширением txt, upload_failed — хранилище отклонило загрузку, no_link —\
  \ хранилище приняло файл, но ссылку не вернуло. При ok=false скажи пользователю\
  , что файл сформировать не удалось, и выдай документ текстом в переписке."
parameters:
- name: fileName
  type: STRING
  required: true
  description: "Имя файла с расширением, латиницей. Расширение выбирай по содержим\
    ому: \"docx\" — документ Word для служебных записок, инструкций, писем; \"xls\"\
    \ — таблица Excel для перечней, графиков, сводок и реестров; \"txt\" — простая\
    \ заметка без оформления. Например \"sluzhebnaya-zapiska.docx\" или \"grafik-ppr.xls\"\
    ."
  properties: null
  items: null
- name: content
  type: STRING
  required: true
  description: "Содержимое документа целиком, готовое к выдаче. Для \"docx\" — обы\
    чный текст, первая строка станет заголовком, пустая строка разделяет абзацы. Д\
    ля \"xls\" — таблица в разметке markdown: первая строка с заголовками столбцов\
    , ячейки разделены знаком \"|\". Для \"txt\" — простой текст."
  properties: null
  items: null
language: JAVASCRIPT
