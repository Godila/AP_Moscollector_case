---
id: glossaryLookup
name: glossaryLookup
description: >-
  Расшифровывает корпоративную или техническую аббревиатуру Москоллектора по
  справочнику сокращений. Вызывай, когда в вопросе пользователя есть непонятное
  сокращение или он прямо просит расшифровать аббревиатуру. Работает только по
  справочнику: если сокращения там нет, функция об этом сообщит, и придумывать
  расшифровку самостоятельно нельзя.
response-description: >-
  При found=true поля term, meaning, note и seeAlso содержат расшифровку из
  справочника. При found=false поле reason объясняет причину: not_found -
  сокращения нет в справочнике, в suggestions могут быть похожие; absent или
  broken - справочник не настроен, отвечать по этому запросу нельзя, надо
  сказать пользователю, что справочник недоступен.
parameters:
  - name: term
    type: STRING
    required: true
    description: >-
      Сокращение как его написал пользователь, например "АРМ ДС", "ППР", "СИЗ".
      Регистр, пробелы и точки внутри значения роли не играют.
  - name: dbIntegration
    type: INTEGRATION_DB
    required: true
    description: >-
      Интеграция базы проекта. Выбирается в настройках узла, модель её
      не заполняет.
language: JAVASCRIPT
